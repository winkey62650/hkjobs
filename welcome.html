<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>秒投 · 登录</title>
<meta name="theme-color" content="#16a34a">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
  min-height:100vh;background:linear-gradient(160deg,#dcfce7,#f0fdf4 55%);
  display:flex;align-items:center;justify-content:center;padding:20px;color:#1e293b}
.wrap{width:100%;max-width:420px}
.brand{text-align:center;margin-bottom:18px}
.brand .logo{display:inline-flex;align-items:center;gap:9px;font-size:1.7rem;
  font-weight:800;color:#15803d}
.brand .logo .ic{width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,#4ade80,#16a34a);display:flex;align-items:center;
  justify-content:center;font-size:1.15rem;box-shadow:0 4px 12px rgba(22,163,74,.4)}
.brand .tag{font-size:.8rem;color:#22c55e;font-weight:700;margin-top:5px}

.card{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(16,163,74,.16);
  overflow:hidden}
.card-pad{padding:22px}
.card h2{font-size:1.05rem;color:#15803d;font-weight:800;margin-bottom:4px}
.card .hint{font-size:.8rem;color:#64748b;line-height:1.6;margin-bottom:14px}
input{width:100%;padding:11px 13px;border:1.5px solid #d1fae5;border-radius:10px;
  font-size:.95rem;outline:none;font-family:inherit;margin-bottom:10px}
input:focus{border-color:#22c55e}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:.92rem;
  font-weight:800;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;
  box-shadow:0 3px 10px rgba(22,163,74,.32)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-primary:disabled{filter:grayscale(.5);cursor:not-allowed}
.btn-ghost{background:#f0fdf4;color:#15803d;border:1.5px solid #86efac}
.btn-ghost:hover{background:#dcfce7}
.divider{text-align:center;font-size:.75rem;color:#94a3b8;margin:13px 0 11px}
.msg{font-size:.82rem;color:#dc2626;text-align:center;margin-top:10px;min-height:18px}

/* 引导问答 */
.code-banner{background:#15803d;color:#fff;padding:10px 14px;font-size:.8rem;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.code-banner b{font-size:.95rem;letter-spacing:.5px;user-select:all}
.chat{height:62vh;min-height:380px;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:86%;padding:9px 13px;border-radius:13px;font-size:.88rem;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bub.ai{background:#f0fdf4;border:1px solid #d1fae5;align-self:flex-start;
  border-bottom-left-radius:3px}
.bub.me{background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;align-self:flex-end;
  border-bottom-right-radius:3px}
.chat-foot{border-top:1px solid #d1fae5;padding:11px;display:flex;gap:8px}
.chat-foot input{margin:0}
.chat-foot button{padding:0 18px;background:linear-gradient(135deg,#4ade80,#16a34a);
  color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:.9rem}
.progress{height:4px;background:#dcfce7}
.progress-bar{height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);
  width:0;transition:width .3s}
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="logo"><span class="ic">⚡</span>秒投</div>
    <div class="tag">香港求职 · 一键速投</div>
  </div>

  <!-- ── 登录卡 ── -->
  <div class="card" id="login-card">
    <div class="card-pad">
      <h2>登录</h2>
      <div class="hint">输入你的账号码即可进入。账号用来在云端保存你的简历资料。</div>
      <input id="code" placeholder="账号码，如 mt-xxxxxxxx" autocomplete="off">
      <button class="btn btn-primary" id="login-btn" onclick="doLogin()">登录</button>
      <div class="divider">— 第一次来？—</div>
      <button class="btn btn-ghost" id="create-btn" onclick="doCreate()">✨ 新建账号</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- ── 引导问答卡 ── -->
  <div class="card" id="onb-card" style="display:none">
    <div class="code-banner" id="code-banner" style="display:none">
      🔑 你的账号码：<b id="banner-code"></b>　请截图保存，换设备靠它登录
    </div>
    <div class="progress"><div class="progress-bar" id="pbar"></div></div>
    <div class="chat">
      <div class="chat-msgs" id="chat"></div>
      <div class="chat-foot">
        <input id="answer" placeholder="输入你的回答…" autocomplete="off">
        <button id="send-btn" onclick="onbNext()">发送</button>
      </div>
    </div>
  </div>
</div>

<script>
const ACCT_KEY = 'miaotou-account';
let acctId = null;

async function apiAccount(payload){
  const r = await fetch('/api/account', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
  return d;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setMsg(t){ document.getElementById('msg').textContent = t || ''; }

// ── 登录 / 新建 ──────────────────────────────────────────────────────────────
async function doLogin(){
  const code = (document.getElementById('code').value||'').trim().toLowerCase();
  if(!code){ setMsg('请输入账号码'); return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '登录中…'; setMsg('');
  try{
    const d = await apiAccount({action:'load', id:code});
    acctId = d.id;
    localStorage.setItem(ACCT_KEY, acctId);
    const p = d.account.profiles && d.account.profiles[0];
    if(p && p.resume){
      // 老用户，已有资料 → 直接进地图
      location.replace('/');
    }else{
      // 账号存在但还没填资料 → 进引导
      startOnboarding(false);
    }
  }catch(err){
    setMsg(err.message);
    btn.disabled = false; btn.textContent = '登录';
  }
}
async function doCreate(){
  const btn = document.getElementById('create-btn');
  btn.disabled = true; btn.textContent = '创建中…'; setMsg('');
  try{
    const d = await apiAccount({action:'create'});
    acctId = d.id;
    localStorage.setItem(ACCT_KEY, acctId);
    startOnboarding(true);
  }catch(err){
    setMsg(err.message);
    btn.disabled = false; btn.textContent = '✨ 新建账号';
  }
}

// ── 引导问答（脚本式、分支、即时）────────────────────────────────────────────
const Q = {
  name:    '先认识一下 —— 你的英文全名？（姓在前，例：CHAN, Mei Ki，简历会用到）',
  email:   '你的常用电邮？',
  target:  '你想找什么方向 / 职位的工作？（例：市场营销、行政文员、数据分析）',
  level:   '你的最高学历是？（本科 / 硕士 / 博士）',
  pg_school:'研究生 —— 在哪所学校就读 / 毕业？',
  pg_major: '研究生 —— 什么专业？',
  pg_exp:   '研究生期间有什么值得写进简历的？（印象深的课程、论文 / 研究方向、成绩荣誉、学术项目 —— 想到什么说什么）',
  ug_school:'本科 —— 在哪所学校就读 / 毕业？',
  ug_major: '本科 —— 什么专业？',
  ug_exp:   '本科期间有什么值得写的？（课程、毕业论文 / 设计、成绩荣誉、社团职务、学术或课程项目）',
  jobcount: '你有几段工作或实习经历？（直接填数字；应届还没有就填 0）',
  skills:   '最后 —— 你的语言能力、电脑 / 软件技能、证书？（有什么写什么）',
};
let questions = [
  {k:'name',q:Q.name},{k:'email',q:Q.email},
  {k:'target',q:Q.target},{k:'level',q:Q.level},
];
let step = 0;
const answers = {};

function startOnboarding(isNew){
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('onb-card').style.display = 'block';
  if(isNew){
    document.getElementById('banner-code').textContent = acctId;
    document.getElementById('code-banner').style.display = 'flex';
  }
  addBub('ai', '你好，欢迎来到秒投 👋\n我会问你一些问题（学历、工作经历…），把你的经历整理成一份专业简历 —— 答得越具体，简历越好。');
  setTimeout(()=>askNext(), 500);
}
function addBub(who, text){
  const c = document.getElementById('chat');
  const d = document.createElement('div');
  d.className = 'bub ' + who;
  d.textContent = text;
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
}
function askNext(){
  if(step < questions.length){
    addBub('ai', questions[step].q);
    document.getElementById('answer').focus();
  }
  document.getElementById('pbar').style.width =
    Math.round(step / Math.max(questions.length,1) * 100) + '%';
}
// 根据回答动态插入后续问题（研究生分支、按段数循环）
function expandQueue(qObj, val){
  if(qObj.k === 'level'){
    const pg = /硕士|博士|研究生|master|phd|doctor|postgrad/i.test(val);
    const block = [];
    if(pg) block.push({k:'pg_school',q:Q.pg_school},{k:'pg_major',q:Q.pg_major},{k:'pg_exp',q:Q.pg_exp});
    block.push({k:'ug_school',q:Q.ug_school},{k:'ug_major',q:Q.ug_major},{k:'ug_exp',q:Q.ug_exp});
    block.push({k:'jobcount',q:Q.jobcount});
    questions.splice(step+1, 0, ...block);
  }
  if(qObj.k === 'jobcount'){
    let n = parseInt((val.match(/\d+/)||['0'])[0], 10);
    n = Math.max(0, Math.min(n, 5));
    const block = [];
    for(let j=1;j<=n;j++){
      block.push({k:'job'+j+'_role',
        q:'第 '+j+' 段经历 —— 职位、公司、大概时间？（例：市场实习生 · ABC 公司 · 2024 暑期）'});
      block.push({k:'job'+j+'_detail',
        q:'第 '+j+' 段 —— 你具体做了什么？负责过哪些项目？有没有可量化的成果（如 提升 30%、办了 5 场活动、服务 200+ 客户）？尽量具体。'});
    }
    block.push({k:'skills',q:Q.skills});
    questions.splice(step+1, 0, ...block);
  }
}
async function onbNext(){
  const inp = document.getElementById('answer');
  const val = (inp.value||'').trim();
  if(!val) return;
  const qObj = questions[step];
  if(qObj.k==='email' && !/.+@.+\..+/.test(val)){
    addBub('ai','这个电邮看起来不太对，再确认一下？'); return;
  }
  addBub('me', val);
  answers[qObj.k] = val;
  inp.value = '';
  expandQueue(qObj, val);
  step++;
  if(step < questions.length){
    setTimeout(()=>askNext(), 300);
  }else{
    document.getElementById('pbar').style.width = '100%';
    inp.disabled = true;
    document.getElementById('send-btn').disabled = true;
    await finishOnboarding();
  }
}
async function finishOnboarding(){
  // AI 整理：原始信息（可能中文/口语）→ 规范英文简历字段
  let secs = 0;
  addBub('ai', '🤖 AI 正在把你的资料整理成专业英文简历…（0 秒，约需 1 分钟）');
  const bub = document.querySelector('#chat .bub:last-child');
  const tmr = setInterval(()=>{
    secs++;
    bub.textContent = '🤖 AI 正在把你的资料整理成专业英文简历…（'+secs+' 秒，约需 1 分钟）';
    document.getElementById('chat').scrollTop = 1e9;
  }, 1000);

  let resume, name;
  try{
    const r = await fetch('/api/interview', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:'onboard', answers})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    resume = buildResume(d);
    name = d.nameEn || answers.name || '名字1';
  }catch(err){
    resume = buildResumeRaw();      // AI 失败兜底：先存原始信息，不卡流程
    name = answers.name || '名字1';
  }
  clearInterval(tmr);

  try{
    await apiAccount({action:'save', id:acctId, profiles:[{name, resume}]});
    localStorage.setItem('miaotou-resume-v2', JSON.stringify(resume));
    bub.textContent = '🎉 专业简历已生成，正在进入职位地图…';
    setTimeout(()=>location.replace('/'), 1300);
  }catch(err){
    bub.textContent = '保存出错：'+err.message+'　请稍后重试';
    document.getElementById('answer').disabled = false;
    document.getElementById('send-btn').disabled = false;
  }
}
// AI 整理后的规范英文 → 简历结构
function buildResume(d){
  return {
    template:'classic', photo:'',
    fields:{
      'f-name-en': d.nameEn || answers.name || '',
      'f-email':   answers.email || '',
      'f-obj':     d.objective || '',
      'sk-misc':   d.skills || ''
    },
    edu:(d.education||[]).map(ed=>({deg:ed.degree||'',sch:ed.school||'',
      per:ed.period||'',gpa:'',det:ed.detail||''})),
    awards:[],
    exp:(d.experience||[]).map(x=>({pos:x.position||'',co:x.company||'',
      dt:x.period||'',bul:(x.bullets||[]).join('\n')})),
    extra:[]
  };
}
// 兜底：AI 整理失败时，先存原始信息（不规范也不卡流程）
function buildResumeRaw(){
  const a = answers;
  const edu = [];
  if(a.pg_school || a.pg_major)
    edu.push({deg:a.pg_major||'',sch:a.pg_school||'',per:'',gpa:'',det:a.pg_exp||''});
  edu.push({deg:a.ug_major||'',sch:a.ug_school||'',per:'',gpa:'',det:a.ug_exp||''});
  const exp = [];
  for(let j=1;j<=5;j++){
    if(a['job'+j+'_role'] || a['job'+j+'_detail'])
      exp.push({pos:a['job'+j+'_role']||'',co:'',dt:'',bul:a['job'+j+'_detail']||''});
  }
  return {
    template:'classic', photo:'',
    fields:{'f-name-en':a.name||'','f-email':a.email||'','sk-misc':a.skills||''},
    edu, awards:[], exp, extra:[]
  };
}

// Enter 发送
['code'].forEach(id=>document.getElementById(id).addEventListener('keydown',
  e=>{ if(e.key==='Enter') doLogin(); }));
document.getElementById('answer').addEventListener('keydown',
  e=>{ if(e.key==='Enter') onbNext(); });

// 已登录 → 直接进地图
if(localStorage.getItem(ACCT_KEY)) location.replace('/');
</script>
</body>
</html>
