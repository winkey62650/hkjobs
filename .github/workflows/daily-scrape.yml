name: Hourly HK Jobs Scrape

on:
  schedule:
    # 每小时整点运行一次
    - cron: "0 * * * *"
  workflow_dispatch:   # 允许手动触发

# 让 GITHUB_TOKEN 能把数据推回仓库
permissions:
  contents: write

# 同一时间只跑一个，避免两次抓取并发推送冲突
concurrency:
  group: hkjobs-scrape
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run scrapers
        run: python run_all.py 2

      - name: Generate map HTML
        run: python map_generator.py

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json index.html version.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: job data update $(TZ='Asia/Hong_Kong' date +'%Y-%m-%d %H:%M') HKT"
            git push
          fi
