<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
     display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#f0fdf4}

/* ── header ── */
.hdr{background:#fff;border-bottom:1px solid #d1fae5;
      box-shadow:0 1px 10px rgba(16,163,74,.07);
      padding:10px 18px;display:flex;align-items:center;gap:14px;flex-shrink:0;z-index:1000;
      flex-wrap:wrap}
.hdr-left{display:flex;flex-direction:column;gap:3px}
.brand{display:flex;align-items:center;gap:8px}
.brand-logo{width:32px;height:32px;border-radius:10px;
      background:linear-gradient(135deg,#4ade80,#16a34a);
      display:flex;align-items:center;justify-content:center;font-size:1.05rem;
      box-shadow:0 3px 8px rgba(22,163,74,.4)}
.hdr h1{font-size:1.35rem;font-weight:800;color:#15803d;letter-spacing:2px}
.brand .slogan{font-size:.7rem;color:#22c55e;font-weight:700;letter-spacing:.5px;
      padding-left:4px;border-left:2px solid #bbf7d0;margin-left:2px}
.hdr-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:1px}
.hdr-info{font-size:.75rem;color:#64748b}
.hdr-info strong{color:#16a34a}
.hdr-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-left:auto}

/* ── 分类下拉 ── */
.cat-dd{position:relative}
.cat-btn{display:flex;align-items:center;gap:7px;padding:8px 14px;
      background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;
      font-size:.83rem;font-weight:700;color:#15803d;cursor:pointer;white-space:nowrap}
.cat-btn:hover{background:#dcfce7;border-color:#22c55e}
.cat-btn .arrow{font-size:.58rem;transition:transform .18s}
.cat-dd.open .cat-btn .arrow{transform:rotate(180deg)}
.cat-panel{position:absolute;top:calc(100% + 7px);left:0;z-index:2000;
      background:#fff;border:1px solid #d1fae5;border-radius:13px;
      box-shadow:0 10px 32px rgba(16,163,74,.2);padding:7px;
      display:none;grid-template-columns:1fr 1fr;gap:2px;width:292px}
.cat-dd.open .cat-panel{display:grid}
.cat-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;
      font-size:.8rem;font-weight:600;color:#475569;cursor:pointer;transition:.1s}
.cat-item:hover{background:#f0fdf4}
.cat-item.on{background:#dcfce7;color:#15803d;font-weight:700}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* ── 日期筛选 ── */
.date-filters{display:flex;gap:4px;align-items:center}
.date-filters .lbl{font-size:.74rem;color:#64748b;font-weight:700;margin-right:2px}
.dtag{padding:6px 12px;border-radius:9px;font-size:.77rem;font-weight:700;
       cursor:pointer;transition:.15s;white-space:nowrap;
       background:#f0fdf4;color:#15803d;border:1.5px solid transparent}
.dtag:hover{background:#dcfce7}
.dtag.on{background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff;
          box-shadow:0 2px 7px rgba(22,163,74,.4)}
.resume-btn{padding:8px 15px;background:linear-gradient(135deg,#4ade80,#16a34a);
             color:#fff;border-radius:10px;font-size:.81rem;font-weight:700;
             text-decoration:none;white-space:nowrap;
             box-shadow:0 2px 8px rgba(22,163,74,.35)}
.resume-btn:hover{filter:brightness(1.08)}

/* ── 视图切换 地图/列表 ── */
.view-toggle{display:flex;background:#f0fdf4;border:1.5px solid #86efac;
      border-radius:10px;overflow:hidden;flex-shrink:0}
.vt-btn{padding:7px 13px;font-size:.8rem;font-weight:700;border:none;
      background:transparent;color:#15803d;cursor:pointer;white-space:nowrap}
.vt-btn.on{background:linear-gradient(135deg,#4ade80,#16a34a);color:#fff}

/* ── main layout ── */
.main{display:flex;flex:1;overflow:hidden;position:relative}
#map{flex:1;z-index:1}

/* ── 列表视图 ── */
#list-view{flex:1;display:none;flex-direction:column;background:#f0fdf4;overflow:hidden}
.list-bar{display:flex;gap:8px;padding:10px 14px;background:#fff;
      border-bottom:1px solid #d1fae5;flex-shrink:0}
.list-bar input{flex:1;padding:8px 12px;border:1.5px solid #d1fae5;
      border-radius:9px;font-size:.85rem;outline:none}
.list-bar input:focus{border-color:#22c55e}
.list-sub{padding:8px 16px 2px;font-size:.78rem;color:#64748b;flex-shrink:0;
      max-width:680px;width:100%;margin:0 auto}
.list-sub strong{color:#16a34a}
.list-body{flex:1;overflow-y:auto;padding:6px 12px 20px;
      display:flex;flex-direction:column;gap:9px;
      max-width:680px;width:100%;margin:0 auto}
.more-btn{margin:10px auto 0;padding:11px 26px;
      background:#fff;border:1.5px solid #86efac;border-radius:11px;
      color:#15803d;font-weight:700;font-size:.84rem;cursor:pointer}
.more-btn:hover{background:#dcfce7}

/* ── sidebar ── */
.side{width:390px;background:#fff;display:flex;flex-direction:column;
       border-left:1px solid #d1fae5;overflow:hidden;transition:width .25s;flex-shrink:0}
.side.closed{width:0}
.sheet-handle{display:none}
.side-hdr{padding:13px 15px 9px;border-bottom:1px solid #d1fae5;flex-shrink:0;
           background:#f0fdf4}
.side-hdr h2{font-size:.98rem;color:#15803d;font-weight:800}
.side-hdr .sub{font-size:.78rem;color:#64748b;margin-top:3px}
.side-close{float:right;cursor:pointer;width:30px;height:30px;border-radius:50%;
             background:#e2e8f0;color:#475569;font-size:1rem;font-weight:800;
             text-align:center;line-height:30px}
.side-close:hover{background:#fecaca;color:#dc2626}
.side-search{padding:9px 14px;border-bottom:1px solid #d1fae5;flex-shrink:0;
              display:flex;gap:6px;align-items:center}
.side-search input{flex:1;padding:7px 11px;border:1.5px solid #d1fae5;
                    border-radius:8px;font-size:.83rem;outline:none}
.side-search input:focus{border-color:#22c55e}
.sort-btn{padding:6px 9px;border:1.5px solid #d1fae5;border-radius:8px;
           font-size:.75rem;color:#15803d;font-weight:700;cursor:pointer;
           white-space:nowrap;background:#fff}
.sort-btn:hover{background:#f0fdf4;border-color:#22c55e}
.job-list{flex:1;overflow-y:auto;padding:9px 11px;display:flex;flex-direction:column;gap:9px}

/* ── job card ── */
.jcard{border-radius:11px;border:1px solid #e2e8f0;border-left:4px solid #86efac;
        transition:.15s;background:#fff}
.jcard:hover{box-shadow:0 4px 16px rgba(16,163,74,.14);border-left-color:#16a34a}
.jc-body{padding:11px 13px 0}
.jc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:3px}
.jc-title{font-size:.88rem;font-weight:700;color:#1e293b;text-decoration:none;line-height:1.35;flex:1}
.jc-title:hover{color:#16a34a;text-decoration:underline}
.jc-src{font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:4px;
         color:#fff;flex-shrink:0;align-self:flex-start;margin-top:2px}
.jc-co{font-size:.8rem;font-weight:600;color:#475569;margin-bottom:7px}
.jc-sal{display:flex;align-items:center;gap:6px;padding:6px 10px;
         background:#f0fdf4;border-radius:7px;margin-bottom:7px}
.jc-sal-icon{font-size:.85rem}
.jc-sal-txt{font-size:.85rem;font-weight:800;color:#15803d}
.jc-sal-none{font-size:.8rem;color:#94a3b8;font-style:italic}
.jc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px}
.badge{border-radius:5px;padding:2px 7px;font-weight:600;font-size:.72rem}
.b-cat{color:#fff}
.b-loc{background:#dcfce7;color:#15803d}
.b-dat{background:#f1f5f9;color:#64748b;font-weight:400}
.jd-tabs{display:flex;border-top:1px solid #f0fdf4;margin-top:2px}
.jd-tab{flex:1;padding:6px 0;font-size:.72rem;font-weight:600;text-align:center;
         cursor:pointer;color:#94a3b8;background:#f8fafc;
         border-bottom:2px solid transparent;transition:.1s;user-select:none}
.jd-tab:hover{color:#16a34a}
.jd-tab.on{color:#16a34a;border-bottom-color:#16a34a;background:#fff}
.jd-panel{padding:9px 13px;font-size:.78rem;color:#475569;line-height:1.6;
           display:none;max-height:90px;overflow-y:auto;background:#fff}
.jd-panel.on{display:block}
.jd-panel em{color:#b0bec5;font-style:italic}
.jc-foot{padding:7px 13px 11px;display:flex;justify-content:flex-end;gap:6px;
          border-top:1px solid #f0fdf4}
.btn{display:inline-block;padding:6px 13px;border-radius:7px;text-decoration:none;
      font-size:.74rem;font-weight:700;color:#fff}
.btn-apply{background:linear-gradient(135deg,#4ade80,#16a34a);
            box-shadow:0 2px 6px rgba(22,163,74,.32)}
.btn-apply:hover{filter:brightness(1.08)}
.btn-cv{background:#0d9488}
.btn-cv:hover{background:#0f766e}

/* ── map marker ── */
.mk-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.mk-circle{width:30px;height:30px;border-radius:50%;
            background:linear-gradient(135deg,#4ade80,#16a34a);
            border:2.5px solid #fff;box-shadow:0 2px 7px rgba(22,163,74,.45);
            display:flex;align-items:center;justify-content:center;
            color:#fff;font-size:.66rem;font-weight:800;cursor:pointer;
            transition:transform .15s}
.mk-circle:hover{transform:scale(1.15)}
.mk-circle.active{background:linear-gradient(135deg,#15803d,#14532d);transform:scale(1.22)}
.mk-label{background:rgba(21,128,61,.85);color:#fff;font-size:.62rem;font-weight:600;
           padding:2px 6px;border-radius:4px;white-space:nowrap;margin-top:3px;
           pointer-events:none}

.empty{padding:36px 20px;text-align:center;color:#94a3b8;font-size:.88rem}

/* ── 新岗位提醒条 ── */
.notify-bar{display:none;align-items:center;gap:10px;
     background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;
     padding:9px 16px;font-size:.85rem;font-weight:600;flex-shrink:0;
     box-shadow:0 2px 8px rgba(16,163,74,.25)}
.notify-bar.show{display:flex}
.nb-text strong{font-size:1.05rem;margin:0 2px}
.nb-view{margin-left:auto;padding:6px 15px;background:#fff;color:#15803d;
     border:none;border-radius:8px;font-weight:800;font-size:.8rem;cursor:pointer}
.nb-view:hover{background:#dcfce7}
.nb-close{cursor:pointer;font-size:1.05rem;opacity:.85;padding:0 3px;
     flex-shrink:0}
.nb-close:hover{opacity:1}
/* 刷新提示气泡 */
.refresh-toast{position:fixed;bottom:20px;left:50%;
     transform:translateX(-50%) translateY(180%);
     background:#15803d;color:#fff;padding:12px 22px;border-radius:13px;
     font-size:.85rem;font-weight:700;cursor:pointer;z-index:3000;
     box-shadow:0 8px 28px rgba(0,0,0,.32);transition:transform .32s}
.refresh-toast.show{transform:translateX(-50%) translateY(0)}
/* 新岗位徽章 + 「仅看新增」chip */
.badge-new{background:#16a34a;color:#fff}
.new-chip{display:inline-flex;align-items:center;gap:4px;cursor:pointer;
     background:#16a34a;color:#fff;padding:2px 9px;border-radius:11px;
     font-size:.74rem;font-weight:700;margin-right:6px}
.new-chip:hover{background:#15803d}

@media(max-width:768px){
  /* 顶栏紧凑化 */
  .hdr{padding:7px 11px;gap:6px}
  .brand-logo{width:26px;height:26px;font-size:.92rem;border-radius:8px}
  .hdr h1{font-size:1.12rem;letter-spacing:1px}
  .brand .slogan{display:none}
  .src-badges{display:none}
  .hdr-info{font-size:.7rem}
  .hdr-right{width:100%;margin-left:0;gap:6px;flex-wrap:wrap}
  .date-filters .lbl{display:none}
  .date-filters{gap:5px;flex-shrink:0}
  .dtag{padding:6px 11px;font-size:.75rem}
  .cat-btn{padding:7px 12px;font-size:.79rem}
  .resume-btn{padding:7px 12px;font-size:.77rem}
  .cat-panel{width:min(300px,calc(100vw - 22px))}

  /* 地图标记缩小 */
  .mk-circle{width:26px;height:26px;font-size:.6rem;border-width:2px}
  .mk-label{display:none}

  /* 职位面板 → 填满页头以下整块区域，关闭按钮永远在页头正下方 */
  .side{position:absolute;top:0;right:0;bottom:0;left:0;z-index:600;
         width:auto;height:auto;border-left:none;border-radius:0;
         box-shadow:0 -6px 24px rgba(0,0,0,.18);
         transform:translateY(0);transition:transform .28s ease}
  .side.closed{width:auto;transform:translateY(100%)}
  .sheet-handle{display:block;width:46px;height:5px;border-radius:3px;
                 background:#86efac;margin:7px auto 0;flex-shrink:0;cursor:pointer}
  .side-hdr{padding:6px 14px 10px}
  .side-close{width:40px;height:40px;line-height:40px;font-size:1.3rem;
               background:#dcfce7;color:#15803d}
  .side-close:active{background:#bbf7d0}
}
</style>
</head>

 or the Diplomate in General Pediatrics in the American Board of Pediatrics or equivalent qualification.]\nDuties: (a) To perform developmental assessments and follow-up for children with developmental and behavioral problems in the outpatient setting;\n(b) To participate in work related to child public health ", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=49438&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "31/12/2025", "date": "2025-12-31", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Contract Clinician (Social Hygiene Service)", "company": "Department of Health", "location": "Hong Kong", "salary": "HKD$101775 Per Month", "sal_num": 101775000.0, "snippet": "Job Number: 49436\nDepartment: Department of Health\nJob Title: Contract Clinician (Social Hygiene Service)\nSalary: Monthly salary at HK$101,775, plus 15% end-of-contract gratuity\nEntry Requirements: Candidates should –\n(a) be permanent residents of the Hong Kong Special Administrative Region;\n(b) possess a medical qualification registrable in Hong Kong under the Medical Registration Ordinance, Cap. 161 or equivalent;\n(c) have at least three years of post-registration experience; and\n(d) have good command of English and be able to communicate in Chinese (Cantonese).\n\n[Preference will be given to candidates who possess the Membership of Royal College of Physicians or equivalent qualification.]\nDuties: (a) To provide consultation and medical treatment to patients with skin diseases or sexually transmitted infections; to perform dermatological diagnostic or therapeutic procedures according to the experience of the Non-civil Service Contract Clinician;\n(b) To provide counselling to clients a", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=49436&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "31/12/2025", "date": "2025-12-31", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Co ng Kong;\n(c) a Master Degree in Orthodontics, or an equivalent qualification; and\n(d) a good command of spoken and written Chinese and English.\n\n(Remarks: Priority will be given to candidates who can work on a full-time basis.)\nDuties: Provision of orthodontic treatment at Government Orthodontic Clinics.\n\n(Remarks: (1) The operating hours of dental clinics fall between 7:45 a.m. and 9:30 p.m. and from Monday to Friday. Successful candidates will be assigned to work in appropriate time slots during the operating hours and required to wear uniform whilst on duty.\n(2) Successful candidates who work on a par", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=34218&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "31/12/2025", "date": "2025-12-31", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Contract Doctor", "company": "Department of Health", "location": "Hong Kong", "salary": "HKD$71010 Per Month", "sal_num": 71010000.0, "snippet": "Job Number: 47553\nDepartment: Department of Health\nJob Title: Contract Doctor\nSalary: Monthly salary at HK$71,010 - HK$101,775 depending on relevant qualification and experience, plus end-of-contract gratuity.\nEntry Requirements: Candidates should –\n(a) be permanent residents of the Hong Kong Special Administrative Region;\n(b) have a recognised medical qualification for registration in Parts I (Full Registration), III (Limited Registration) or V (Special Registration) of the General Register in accordance with the Medical Registration Ordinance (Cap. 161);\n(c) have good command of English and be able to communicate in Chinese.\n\n(Remarks: For eligible non locally-trained doctors, a new Special Registration pathway under the Medical Council of Hong Kong is available for you to apply full registration after obtaining specialist qualification in Hong Kong. Details of Special Registration can be found at the website of the Medical Council of Hong Kong website (https:/ e7d34", "is_new": false}, {"title": "Part-time Contract Doctor", "company": "Department of Health", "location": "Hong Kong", "salary": "HKD$459 Per Hour", "sal_num": 459000.0, "snippet": "Job Number: 44633\nDepartment: Department of Health\nJob Title: Part-time Contract Doctor\nSalary: HK$459 - HK$550 per hour depending on relevant experience.\nEntry Requirements: Candidates should have –\n(a) a medical qualification registrable in Hong Kong under the Medical Registration Ordinance, Cap. 161; and\n(b) a good command of spoken and written Chinese and English.\nDuties: Mainly deployed on clinical and non-clinical duties in the following programme areas:\n(a) statutory functions;\n(b) disease prevention;\n(c) health promotion;\n(d) curative care; and\n(e) rehabilitation.\n\n(Remarks:\n(1) Selected candidates may be required to work shifts outside normal working hours and perform on-call duties.\n(2) There is no specific closing date for application for this position, but applications will close without further announcement when all the vacancies are filled.)\nTerms of Appointment: Successful candidate will be appointed on non-civil service contract terms for 12 months. Renewal of contract ", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=44633&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "31/12/2025", "date": "2025-12-31", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Part-time Contract Doctor (Narcotics & Drug Administration Division)", "company": "Department of Health", "location": "Hong Kong", "salary": "HKD$459 Per Hour", "sal_num": 459000.0, "snippet": "Job Number: 50043\nDepartment: Department of Health\nJob Title: Part-time Contract Doctor (Narcotics & Drug Administration Division)\nSalary: HK$ 459 - HK$ 599 per hour depending on relevant experience\nEntry Requirements: Candidates should –\n(a) have a medical qualification registrable in Hong Kong under the Medical Registration Ordinance, Cap. 161;\n(b) have a good command of spoken and written Chinese and English; and\n(c) be able to speak fluent Cantonese.\nDuties: Mainly deployed on clinical, public health and medical administration duties to treat drug abusers –\n(a) providing medical consultation, counseling and health education for drug abusers including detoxification;\n(b) methadone maintenance, prevention, screening and follow-up of blood-borne diseases such as hepatitis and HIV; and\n(c) providing vaccinations (e.g. tetanus, hepatitis B) for drug abusers.\n\n[Remark: Successful candidates :-\n(i) may work in holidays and day time on weekdays as required;\n(ii) may need to work in evening", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=50043&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "11/05/2026", "date": "2026-05-11", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Registered Pharmacist", "company": "Department of Health", "location": "Hong Kong", "salary": "HKD$53980 Per Month", "sal_num": 53980000.0, "snippet": "Job Number: 50018\nDepartment: Department of Health\nJob Title: Registered Pharmacist\nSalary: HK$53,980 to HK$59,110 per month, depending on the year of relevant post-registration experience (Note 1)\nEntry Requirements: Candidates should -\n(a) be registered with the Pharmacy and Poisons Board of Hong Kong established under the Pharmacy and Poisons Ordinance, Chapter 138;\n(b) hold a valid Practising Certificate issued by the Pharmacy and Poisons Board of Hong Kong; and\n(c) have met the language proficiency requirements of ‘Level 1’ or above results in the two language papers (Use of Chinese and Use of English) in the Common Recruitment Examination (“CRE”) or equivalent (Note 2), and be able to communicate in Cantonese / Chinese and English.\n\nCandidates who have received training or have obtained qualification in Chinese Medicines will have an advantage.\nNote: (1) Relevant experience acquired after registration with the Pharmacy Boards in the United Kingdom, Australia, Canada and USA may b", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=50018&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "11/05/2026", "date": "2026-05-11", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Senior Clinician (Orthodontics)", "company": "Department of Health", "location": "Hong Kong", "salary": "HKD$137085 Per Month", "sal_num": 137085000.0, "snippet": "Job Number: 34217\nDepartment: Department of Health\nJob Title: Senior Clinician (Orthodontics)\nSalary: Full-time: HK$137,085 per month (plus end-of-contract gratuity)\nPart-time: HK$780 per hour\nEntry Requirements: Candidates should -\n(a) have full registration in Hong Kong under the Dentists Registration Ordinance;\n(b) possess a valid practising certificate issued by the Dental Council of Hong Kong;\n(c) possess a Master Degree in Orthodontics, or an equivalent qualification; and\n(d) have a good command of spoken and written Chinese and English.\nDuties: Provision of orthodontic treatment and professional support in the orthodontic training of Dental Officers at Government Orthodontic Clinics.\n\n(Remarks: (1) The operating hours of dental clinics fall between 7:45 a.m. and 9:30 p.m. and from Monday to Friday. Successful candidates will be assigned to work in appropriate time slots during the operating hours and required to wear uniform whilst on duty.\n(2) Successful candidates who work on ", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=34217&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "31/12/2025", "date": "2025-12-31", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Executive Manager (Education Hub) (EDB/HE/127/26 )", "company": "Education Bureau", "location": "Hong Kong", "salary": "HKD$58890 Per Month", "sal_num": 58890000.0, "snippet": "Job Number: 50028\nDepartment: Education Bureau\nDivision/Section/Unit: Higher Education Division\nJob Title: Executive Manager (Education Hub) (EDB/HE/127/26 )\nSalary: $58,890 per month\nEntry Requirements: (a) A Hong Kong bachelor's degree, or equivalent [see Notes (ii) & (iii)];\n(b) Met the language proficiency requirements of Level 3 or above in Chinese Language and English Language in the Hong Kong Diploma of Secondary Education Examination (HKDSEE) or the Hong Kong Certificate of Education Examination (HKCEE), or equivalent [see Note (v)];\n(c) At least 6 years of full-time post-degree working experience (of which at least 4 years in administration and management work);\n(d) Working experience in tender process in the government/public sector or publicity and marketing preferred;\n(e) Self-motivated, able to work under pressure and can handle multiple projects within tight timeframe;\n(f) Strong planning, organization and analytical skills;\n(g) Outstanding communication and interpersonal", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=50028&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "08/05/2026", "date": "2026-05-08", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Part-time Educational Psychologist (EDB/SE/126/26)", "company": "Education Bureau", "location": "Hong Kong", "salary": "HKD$484 Per Hour", "sal_num": 484000.0, "snippet": "Job Number: 50027\nDepartment: Education Bureau\nDivision/Section/Unit: Special Education Division\nJob Title: Part-time Educational Psychologist (EDB/SE/126/26)\nSalary: $484 per hour (Required to work not more than 16 hours per week)\nEntry Requirements: (a) A Hong Kong bachelor's degree in Psychology, or equivalent;\n(b) A certificate in education from Hong Kong tertiary educational institution, or equivalent;\n(c) A Hong Kong Master's degree in Educational Psychology (Professional Practice), or equivalent;\n(d) Met the language proficiency requirements of Level 2 or above in Chinese Language and English Language in the Hong Kong D umber: 49997\nDepartment: Judiciary\nDivision/Section/Unit: Corporate Services Division\nJob Title: Contract Marshal\nSalary: $45,000 per month\nEntry Requirements: (a) Applicants should possess a Law Degree with at least Second Class Honours, or the equivalent, and a Postgraduate Certificate in Laws (“PCLL”). Applicants who will have obtained a PCLL by summer 2026 (see note) may also apply. They should be about to embark on pupillage or traineeship, or be in the course of or have completed the same, but generally should not have more than one year’s post-qualification experience at the time of the application. It may be noted that greater flexibility has been introduced by making candidates eligible before obtaining a PCLL; and before completion of pupillage or a traineeship;\n\n(b) Proficiency in Chinese would be a clear asset; and\n\n(c) Applicants must be permanent residents of the Hong Kong Special Administrative Region.\nNote: Applicants who will have obtained a PCLL by summer 2026, i", "url": "https://csboa2.csb.gov.hk/csboa/jve/JVE_003_text.action?jobid=49997&languageType=2", "label": "行政", "color": "#f59e0b", "posted": "25/04/2026", "date": "2026-04-25", "source": "GovHK", "src_color": "#1e7d34", "is_new": false}, {"title": "Contract Lifeguard", "company": "Leisure and Cultural Services Department", "location": "Hong Kong", "salary": "HKD$22100 Per Month", "sal_num": 22100000.0, "snippet": "Job Number: 50058\nDepartment: Leisure and Cultural Services Department\nDivision/Section/Unit: Appointments and Establishment Unit, Leisure Services Support Section\nJob Title: Contract Lifeguard\nSalary: Contract Full-year Lifeguard:\n$22,400/mth(Pool Lifeguard Award)\n$23,400/mth(Beach Lifeguard Award)\n$23,500/mth(Pool & Beach Lifeguard Awards)\n\nSeasonal Lifeguard :\n$22,100/mth(Swimming Pool)\n$23,100/mth(Beaches/Water Sports Centre)\n$113/hr(Swimming Pool)\n$118/hr(Beaches/Water Sports Centre)\nEntry Requirements: (1) possess a valid Pool Lifeguard Award and/or B const ALL_JOBS  = LOCATIONS.flatMap(l => l.jobs);
let currentView = 'map';

const isMobile = window.matchMedia('(max-width:768px)').matches;
const map = L.map('map', {
  center: [22.3193, 114.1694],
  zoom: isMobile ? 11 : 12,
  zoomControl: !isMobile,
});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a>',
  maxZoom: 18,
}).addTo(map);

let activeCategory = 'all';
let activeMarkerEl = null;
let currentJobs    = [];
let sortBySalary   = false;
let activeDateMode = '3days';   // today / yesterday / 3days / all
let showOnlyNew    = false;

const TODAY     = new Date("2026-05-22T00:00:00Z");
const NEW_COUNT = 0;
const GEN_TS    = "2026-05-21T16:59:01Z";

function jobAgeDays(j) {
  if (!j.date) return 9999;
  const d = new Date(j.date + "T00:00:00Z");
  if (isNaN(d)) return 9999;
  return Math.floor((TODAY - d) / 86400000);
}
function dateOk(j) {
  if (activeDateMode === 'all') return true;
  const a = jobAgeDays(j);
  if (activeDateMode === 'today')     return a <= 0;
  if (activeDateMode === 'yesterday') return a === 1;
  return a <= 3;   // 近三天
}
function dateModeLabel() {
  return ({today:'今日', yesterday:'昨日', '3days':'近三天', all:'全部'})[activeDateMode];
}
function catOk(j) {
  return activeCategory === 'all' || j.label === activeCategory;
}
function ageLabel(j) {
  const a = jobAgeDays(j);
  if (a >= 9999) return '';
  if (a <= 0) return '今天';
  if (a === 1) return '昨天';
  return a + '天前';
}
// 薪资排序：有薪资的按高→低，"面议"(无薪资)统一排最后
function salCmp(a, b) {
  if (a.sal_num && b.sal_num) return b.sal_num - a.sal_num;
  if (a.sal_num) return -1;
  if (b.sal_num) return 1;
  return jobAgeDays(a) - jobAgeDays(b);
}

// ── 标记 ──────────────────────────────────────────────────────────────────────
const markers = [];
LOCATIONS.forEach((loc, idx) => {
  const icon = L.divIcon({
    className: '',
    html: `<div class="mk-wrap">
      <div class="mk-circle" id="mk-${idx}">${loc.jobs.length}</div>
      <div class="mk-label">${loc.name.split(' ')[0]}</div>
    </div>`,
    iconSize: [50, 52],
    iconAnchor: [25, 18],
  });
  const marker = L.marker([loc.lat, loc.lng], { icon }).addTo(map);
  marker.on('click', () => openSidebar(loc, idx));
  markers.push({ marker, loc, idx });
});

// ── 刷新所有标记数字 + 总数 ───────────────────────────────────────────────────
function refreshMarkers() {
  let total = 0;
  LOCATIONS.forEach((loc, idx) => {
    const cnt = loc.jobs.filter(j => catOk(j) && dateOk(j)).length;
    total += cnt;
    const el = document.getElementById('mk-' + idx);
    if (el) {
      el.textContent = cnt;
      el.style.opacity = cnt > 0 ? '1' : '0.25';
    }
  });
  const tc = document.getElementById('total-count');
  if (tc) tc.textContent = total;
}
refreshMarkers();

// ── 侧边栏 ────────────────────────────────────────────────────────────────────
function openSidebar(loc, idx) {
  if (activeMarkerEl) activeMarkerEl.classList.remove('active');
  const mkEl = document.getElementById('mk-' + idx);
  if (mkEl) { mkEl.classList.add('active'); activeMarkerEl = mkEl; }
  currentJobs = loc.jobs;
  document.getElementById('side-title').textContent = loc.name;
  document.getElementById('side-q').value = '';
  renderJobs(loc.jobs);
  document.getElementById('side').classList.remove('closed');
}

function closeSidebar() {
  document.getElementById('side').classList.add('closed');
  if (activeMarkerEl) { activeMarkerEl.classList.remove('active'); activeMarkerEl = null; }
}

document.getElementById('side-close').addEventListener('click', closeSidebar);
document.getElementById('sheet-handle').addEventListener('click', closeSidebar);
// 点地图空白处也能关闭职位列表
map.on('click', closeSidebar);

document.getElementById('side-q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const filtered = q
    ? currentJobs.filter(j => (j.title+j.company+j.snippet).toLowerCase().includes(q))
    : currentJobs;
  renderJobs(filtered);
});

document.getElementById('sort-btn').addEventListener('click', () => {
  sortBySalary = !sortBySalary;
  document.getElementById('sort-btn').textContent = sortBySalary ? '🕐 最新' : '💰 薪资';
  renderJobs(currentJobs);
});

function renderJobs(jobs) {
  let filtered = jobs.filter(j => catOk(j) && dateOk(j));

  filtered.sort(sortBySalary ? salCmp : (a, b) => jobAgeDays(a) - jobAgeDays(b));

  document.getElementById('side-sub').textContent =
    `${filtered.length} 个职位 · ${dateModeLabel()}` +
    (activeCategory !== 'all' ? `（${activeCategory}）` : '');

  const list = document.getElementById('job-list');
  list.innerHTML = filtered.length
    ? filtered.map(buildCard).join('')
    : '<div class="empty">该地区暂无此类职位</div>';
}

// ── 职位卡片（地图侧栏 + 列表视图共用）───────────────────────────────────────
function buildCard(j) {
  const hasSal = j.salary && j.salary !== '薪资面议';
  const salRow = hasSal
    ? `<div class="jc-sal"><span class="jc-sal-icon">💰</span><span class="jc-sal-txt">${j.salary}</span></div>`
    : `<div class="jc-sal"><span class="jc-sal-icon">💰</span><span class="jc-sal-none">薪资面议</span></div>`;
  const jdEnc = encodeURIComponent((j.snippet || '').substring(0, 1000));
  const al = ageLabel(j);
  let dateBadge = '';
  if (al) {
    const fresh = jobAgeDays(j) <= 2;
    dateBadge = `<span class="badge" style="background:${fresh?'#dcfce7':'#f1f5f9'};`
              + `color:${fresh?'#166534':'#64748b'}">🕐 ${al}</span>`;
  } else if (j.posted) {
    dateBadge = `<span class="badge b-dat">🕐 ${j.posted}</span>`;
  }
  return `
  <div class="jcard">
    <div class="jc-body">
      <div class="jc-top">
        <a class="jc-title" href="${j.url}" target="_blank">${j.title}</a>
        <span class="jc-src" style="background:${j.src_color}">${j.source}</span>
      </div>
      <div class="jc-co">${j.company}</div>
      ${salRow}
      <div class="jc-tags">
        ${j.is_new ? '<span class="badge badge-new">🆕 新</span>' : ''}
        <span class="badge b-cat" style="background:${j.color}">${j.label}</span>
        <span class="badge b-loc">📍 ${j.location || '不限地区'}</span>
        ${dateBadge}
      </div>
      ${j.snippet ? `<div class="jd-panel on">${j.snippet}</div>` : ''}
    </div>
    <div class="jc-foot">
      <a class="btn btn-apply" href="${j.url}" target="_blank">查看完整JD →</a>
      ${jdEnc ? `<a class="btn btn-cv" href="resume.html?jd=${jdEnc}" target="_blank">✨ 匹配简历</a>` : ''}
    </div>
  </div>`;
}

// ── 分类过滤 ──────────────────────────────────────────────────────────────────
const catDd = document.getElementById('cat-dd');
document.getElementById('cat-btn').addEventListener('click', e => {
  e.stopPropagation();
  catDd.classList.toggle('open');
});
document.addEventListener('click', () => catDd.classList.remove('open'));

document.getElementById('cat-panel').addEventListener('click', e => {
  e.stopPropagation();
  const item = e.target.closest('.cat-item');
  if (!item) return;
  activeCategory = item.dataset.cat;
  document.querySelectorAll('.cat-item').forEach(t => t.classList.remove('on'));
  item.classList.add('on');
  document.getElementById('cat-btn-label').textContent =
    '🏷 ' + (activeCategory === 'all' ? '全部分类' : activeCategory);
  catDd.classList.remove('open');
  refreshMarkers();
  if (!document.getElementById('side').classList.contains('closed')) {
    renderJobs(currentJobs);
  }
  if (currentView === 'list') renderList();
});

// ── 日期过滤 ──────────────────────────────────────────────────────────────────
document.getElementById('date-filters').addEventListener('click', e => {
  const tag = e.target.closest('.dtag');
  if (!tag) return;
  activeDateMode = tag.dataset.mode;
  document.querySelectorAll('.dtag').forEach(t => t.classList.remove('on'));
  tag.classList.add('on');
  refreshMarkers();
  if (!document.getElementById('side').classList.contains('closed')) {
    renderJobs(currentJobs);
  }
  if (currentView === 'list') renderList();
});

// ── 列表视图 ──────────────────────────────────────────────────────────────────
let listLimit = 80;
function getListJobs() {
  let arr = ALL_JOBS.filter(j => catOk(j) && dateOk(j));
  if (showOnlyNew) arr = arr.filter(j => j.is_new);
  const q = document.getElementById('list-q').value.trim().toLowerCase();
  if (q) arr = arr.filter(j => (j.title + j.company + j.snippet).toLowerCase().includes(q));
  arr = arr.slice();
  arr.sort(sortBySalary ? salCmp : (a, b) => jobAgeDays(a) - jobAgeDays(b));
  return arr;
}
function renderList(resetLimit) {
  if (resetLimit !== false) listLimit = 80;
  const arr = getListJobs();
  const newChip = showOnlyNew
    ? '<span class="new-chip" id="new-chip">🆕 仅看新增 ✕</span>' : '';
  document.getElementById('list-count').innerHTML = newChip +
    `共 <strong>${arr.length}</strong> 个职位 · ${dateModeLabel()}` +
    (activeCategory !== 'all' ? ` · ${activeCategory}` : '');
  const body = document.getElementById('list-body');
  if (!arr.length) {
    body.innerHTML = '<div class="empty">没有符合条件的职位</div>';
    return;
  }
  body.innerHTML = arr.slice(0, listLimit).map(buildCard).join('');
  if (arr.length > listLimit) {
    const btn = document.createElement('button');
    btn.className = 'more-btn';
    btn.textContent = `加载更多（还有 ${arr.length - listLimit} 个）`;
    btn.onclick = () => { listLimit += 120; renderList(false); };
    body.appendChild(btn);
  }
}
document.getElementById('list-q').addEventListener('input', () => renderList());
document.getElementById('list-sort').addEventListener('click', () => {
  sortBySalary = !sortBySalary;
  document.getElementById('list-sort').textContent = sortBySalary ? '🕐 最新' : '💰 薪资';
  renderList();
});

// ── 视图切换 地图/列表 ────────────────────────────────────────────────────────
document.getElementById('view-toggle').addEventListener('click', e => {
  const b = e.target.closest('.vt-btn');
  if (!b) return;
  currentView = b.dataset.view;
  document.querySelectorAll('.vt-btn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  const listMode = currentView === 'list';
  document.getElementById('map').style.display = listMode ? 'none' : '';
  document.getElementById('list-view').style.display = listMode ? 'flex' : 'none';
  closeSidebar();
  if (listMode) renderList();
  else setTimeout(() => map.invalidateSize(), 60);
});

// ── 新岗位提醒 ────────────────────────────────────────────────────────────────
if (NEW_COUNT > 0) {
  document.getElementById('nb-count').textContent = NEW_COUNT;
  document.getElementById('notify-bar').classList.add('show');
}
document.getElementById('nb-close').addEventListener('click', () => {
  document.getElementById('notify-bar').classList.remove('show');
});
document.getElementById('nb-view').addEventListener('click', () => {
  showOnlyNew = true;
  document.getElementById('notify-bar').classList.remove('show');
  document.querySelector('.vt-btn[data-view="list"]').click();
});
// 列表里点「仅看新增 ✕」chip 取消筛选
document.getElementById('list-count').addEventListener('click', e => {
  if (e.target.id === 'new-chip') { showOnlyNew = false; renderList(); }
});

// ── 每10分钟检查是否有新一轮更新 ──────────────────────────────────────────────
const refreshToast = document.getElementById('refresh-toast');
refreshToast.addEventListener('click', () => location.reload());
async function checkUpdates() {
  try {
    const v = await fetch('/version.json?_=' + Date.now(), {cache:'no-store'})
                      .then(r => r.json());
    if (v.generated_at && v.generated_at > GEN_TS) {
      refreshToast.textContent = v.new_last_hour > 0
        ? `🔄 新增 ${v.new_last_hour} 个职位 · 点此刷新`
        : '🔄 职位已更新 · 点此刷新';
      refreshToast.classList.add('show');
    }
  } catch (e) {}
}
setInterval(checkUpdates, 10 * 60 * 1000);

// ── PWA Service Worker ────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body></html>
